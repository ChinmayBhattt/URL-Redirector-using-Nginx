# ==============================================================================
# MINI URL REDIRECTOR - NGINX CONFIGURATION FILE
# ==============================================================================
# This configuration demonstrates Nginx functioning as:
# 1. A High-Performance Static Web Server
# 2. A Reverse Proxy forwarding requests to a Node.js Express backend
# 3. An Edge HTTP Redirect engine
# 4. A Custom Error Handler
# ==============================================================================

# 'worker_processes' defines the number of worker processes.
# '1' or 'auto' (one worker per CPU core) is standard.
worker_processes 1;

# Path where Nginx writes its Process ID (PID)
pid /tmp/nginx_mini_project.pid;

# Specifies the file and logging level for server-wide error logs.
# Log levels: debug, info, notice, warn, error, crit, alert, emerg.
error_log /tmp/nginx_mini_project_error.log info;

# ------------------------------------------------------------------------------
# EVENTS BLOCK
# ------------------------------------------------------------------------------
# Configures connection handling at the network layer.
events {
    # Maximum number of simultaneous active connections each worker can handle.
    worker_connections 1024;
}

# ------------------------------------------------------------------------------
# HTTP BLOCK
# ------------------------------------------------------------------------------
# Contains all HTTP-related directives, configurations, and server blocks.
http {
    # Include standard MIME types mapping (e.g. .html -> text/html, .css -> text/css)
    include /opt/homebrew/etc/nginx/mime.types;

    # Fallback MIME type if a file's extension isn't in mime.types
    default_type application/octet-stream;

    # Standard log format for access logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # File where HTTP access logs will be recorded
    access_log /tmp/nginx_mini_project_access.log main;

    # Optimize data transfer by sending files directly from the OS kernel buffer
    sendfile on;

    # Timeout (in seconds) during which a keep-alive client connection stays open
    keepalive_timeout 65;

    # Temporary directory paths (using /tmp prevents permission errors on macOS)
    client_body_temp_path /tmp/nginx_client_body_temp;
    proxy_temp_path /tmp/nginx_proxy_temp;
    fastcgi_temp_path /tmp/nginx_fastcgi_temp;
    uwsgi_temp_path /tmp/nginx_uwsgi_temp;
    scgi_temp_path /tmp/nginx_scgi_temp;

    # ==========================================================================
    # SERVER BLOCK (Virtual Host)
    # ==========================================================================
    server {
        # The port Nginx listens on.
        # NOTE: Port 80 is the standard HTTP port. (On Unix/macOS, binding to port 80
        # requires root/sudo privileges. If running without sudo, use port 8080).
        listen 80;

        # The domain name or IP address this server responds to
        server_name localhost;

        # ----------------------------------------------------------------------
        # D. ERROR HANDLING
        # ----------------------------------------------------------------------
        # 'error_page' intercepts HTTP 404 Not Found errors and redirects the
        # user internally to our custom /404.html page instead of a default error.
        error_page 404 /404.html;

        # Specific location block for the custom 404 page
        location = /404.html {
            # Root directory where 404.html is stored
            root /Users/chinmaybhatt/ngix/mini-nginx-project/frontend;

            # 'internal' prevents clients from directly requesting http://localhost/404.html
            # It can ONLY be accessed internally through Nginx error redirection.
            internal;
        }

        # ----------------------------------------------------------------------
        # A. STATIC FILE SERVING (Web Server)
        # ----------------------------------------------------------------------
        # Matches all requests starting with '/' that are not caught by more
        # specific location blocks below.
        location / {
            # 'root' sets the document root folder on the filesystem.
            # Request URL '/style.css' maps to '<root>/style.css'.
            root /Users/chinmaybhatt/ngix/mini-nginx-project/frontend;

            # 'index' defines which default file to serve when a directory is requested.
            # When user visits http://localhost/, Nginx serves '<root>/index.html'.
            index index.html;

            # 'try_files' checks if the requested file exists, then if a directory
            # exists. If neither exists, it raises an HTTP 404 error.
            try_files $uri $uri/ =404;
        }

        # ----------------------------------------------------------------------
        # B. REVERSE PROXY TO NODE.JS EXPRESS BACKEND
        # ----------------------------------------------------------------------
        # Matches any request starting with '/api/'
        location /api/ {
            # 'proxy_pass' forwards the incoming request to the upstream server.
            # Here, it sends the request to Node.js running on port 3000.
            proxy_pass http://127.0.0.1:3000;

            # 'proxy_set_header' passes critical metadata from the client to Node.js:
            # Pass original Host header sent by client (e.g. localhost)
            proxy_set_header Host $host;

            # Pass the real client IP address (without this, Node.js sees 127.0.0.1)
            proxy_set_header X-Real-IP $remote_addr;

            # Append the client IP to the list of proxy forwarders
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Pass the protocol used by the client (http or https)
            proxy_set_header X-Forwarded-Proto $scheme;

            # Connection timeouts for backend communication
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Route '/redirect' to Node.js Express backend
        location /redirect {
            proxy_pass http://127.0.0.1:3000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------------------------
        # C. CUSTOM REDIRECT (Edge HTTP Redirect)
        # ----------------------------------------------------------------------
        # Instantly redirects requests for '/google' to 'https://www.google.com'.
        # 'return 302' sends an HTTP 302 (Temporary Redirect) status code.
        # This is handled directly by Nginx without ever touching the Node.js backend!
        location /google {
            return 302 https://www.google.com;
        }
    }
}
